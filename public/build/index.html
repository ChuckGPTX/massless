<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Build — Chucksi</title>
    <meta name="theme-color" content="#0b0b0c" />
    <link rel="icon" href="/favicon.svg" />
    <!-- Build is two tabs: Games (/games/) and Website (/website/). Old links (/build/?template=game|website,
         with a #g= or #play= game link) land on the right one. -->
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get("template");
        var games = t !== "website" || /^#(g|play)=/.test(location.hash);
        location.replace((games ? "/games/" : "/website/") + location.hash);
      })();
    </script>
    <link rel="stylesheet" href="/css/site.css" />
  </head>
  <body>
    <main class="wrap" style="padding: 48px 16px">
      <h1>Build</h1>
      <p>Make a game or a website, in your browser.</p>
      <p><a class="btn-accent" href="/games/">Games</a> <a class="btn-ghost" href="/website/">Website</a></p>
    </main>
  </body>
</html>
