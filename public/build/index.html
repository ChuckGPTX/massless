    <!-- Build is two tabs: Games (/games/) and Website (/website/). Old links (/build/?template=game|website,
         with a #g= or #play= game link) land on the right one. -->
    <script>
      (function () {
        var t = new URLSearchParams(location.search).get("template");
        var games = t !== "website" || /^#(g|play)=/.test(location.hash);
        location.replace((games ? "/games/" : "/website/") + location.hash);
      })();
    </script>
