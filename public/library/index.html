  </head>
  <body>
    <header class="nav">
      <a class="nav-logo" href="/" aria-label="Chucksi home"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <circle
            cx="16"
            cy="16"
            r="11.5"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />
          <circle cx="16" cy="16" r="3.6" fill="currentColor" />
          <path
            d="M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6"
            stroke="currentColor"
            stroke-width="3"
          /></svg
      ></a>
      <nav class="nav-links" aria-label="Main"></nav>
      <div class="nav-right">
        <a class="btn-ghost" href="/library/">My library</a
        ><a class="btn-accent" href="/workflows/">Workflows ↗</a>
      </div>
    </header>
    <main class="bench">
      <section class="bench-intro">
        <p class="eyebrow">YOUR CREATIVE MATERIAL</p>
        <h1>Keep the good takes.</h1>
        <p>
          Images, clips and audio in one place. Choose a piece and take it into
          your next tool. No account needed.
        </p>
        <div class="actions">
          <label class="btn-accent"
            >Add files<input
              id="files"
              type="file"
              multiple
              accept="image/*,video/*,audio/*"
              hidden /></label
          ><a class="btn-ghost" href="/projects/"
            >Optional private cloud projects ↗</a
          >
        </div>
      </section>
      <div class="toolbar">
        <label
          >Find media<input
            id="search"
            type="search"
            placeholder="Search" /></label
        ><label
          >Show<select id="kind">
            <option value="all">Everything</option>
            <option>image</option>
            <option>video</option>
            <option>audio</option>
          </select></label
        >
      </div>
      <p id="status" role="status"></p>
      <div id="assets" class="asset-grid"></div>
    </main>
    <footer class="bench-foot">
      <span>© 2026 Chucksi</span>
      <nav class="foot-links" aria-label="Footer"><a href="/credits.html">Credits</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="https://github.com/ChuckGPTX/massless" rel="noopener">GitHub ↗</a></nav>
    </footer>
  </body>
