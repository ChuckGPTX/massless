<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Your creative library — Massless</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/css/site.css" />
    <link rel="stylesheet" href="/css/navigation.css" />
    <link rel="stylesheet" href="/css/workbench.css" />
    <script type="module" src="/js/navigation.js"></script>
    <script type="module" src="/js/pages/library.js"></script>
  </head>
  <body>
    <header class="nav">
      <a class="nav-logo" href="/" aria-label="Massless home"
        ><svg viewBox="0 0 32 32" aria-hidden="true">
          <circle
            cx="16"
            cy="16"
            r="11.5"
            fill="none"
            stroke="currentColor"
            stroke-width="3"
          />
          <circle cx="16" cy="16" r="3.6" fill="currentColor" />
          <path
            d="M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6"
            stroke="currentColor"
            stroke-width="3"
          /></svg
      ></a>
      <nav class="nav-links" aria-label="Main"></nav>
      <div class="nav-right">
        <a class="btn-ghost" href="/library/">My library</a
        ><a class="btn-accent" href="/workflows/">Workflows ↗</a>
      </div>
    </header>
    <main class="bench">
      <section class="bench-intro">
        <p class="eyebrow">YOUR CREATIVE MATERIAL</p>
        <h1>Keep the good takes.</h1>
        <p>
          Images, clips and audio in one place. Choose a piece and take it into
          your next tool. No account needed.
        </p>
        <div class="actions">
          <label class="btn-accent"
            >Add files<input
              id="files"
              type="file"
              multiple
              accept="image/*,video/*,audio/*"
              hidden /></label
          ><a class="btn-ghost" href="/projects/"
            >Optional private cloud projects ↗</a
          >
        </div>
      </section>
      <div class="toolbar">
        <label
          >Find media<input
            id="search"
            type="search"
            placeholder="Search names and prompts" /></label
        ><label
          >Show<select id="kind">
            <option value="all">Everything</option>
            <option>image</option>
            <option>video</option>
            <option>audio</option>
          </select></label
        >
      </div>
      <p id="status" role="status"></p>
      <div id="assets" class="asset-grid"></div>
    </main>
    <footer class="bench-foot">
      Made here. Kept here. Free tools, open source.
      <a href="https://github.com/ChuckGPTX/massless">View source ↗</a>
    </footer>
  </body>
</html>
