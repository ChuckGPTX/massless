  <link rel="stylesheet" href="/css/site.css">
  <style>
    .rp { max-width: 560px; margin: 0 auto; padding: 112px 20px 72px; line-height: 1.6; }
    .rp h1 { font-size: clamp(32px, 6vw, 44px); line-height: 1.1; margin: 0 0 10px; }
    .rp > p { color: var(--muted, #b9b9bf); margin: 0 0 24px; }
    .rp form { display: grid; gap: 18px; }
    .rp label, .rp legend { font-weight: 600; font-size: 14px; display: block; margin-bottom: 6px; }
    .rp fieldset { border: 0; padding: 0; margin: 0; }
    .rp input[type=text], .rp input[type=email], .rp textarea { width: 100%; box-sizing: border-box; padding: 11px 12px; border-radius: 10px; border: 1px solid var(--line-2, #2c2c33); background: var(--bg-2, #141417); color: var(--text, #f4f4f1); font: inherit; font-size: 15px; }
    .rp textarea { min-height: 110px; resize: vertical; }
    .rp input:focus, .rp textarea:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
    .rp .addr { display: flex; align-items: center; border-radius: 10px; border: 1px solid var(--line-2, #2c2c33); background: var(--bg-2, #141417); overflow: hidden; }
    .rp .addr input { border: 0; background: transparent; text-align: right; outline: none; }
    .rp .addr span { padding-right: 12px; color: var(--muted, #b9b9bf); white-space: nowrap; }
    .rp .reasons { display: flex; flex-wrap: wrap; gap: 8px; }
    .rp .reasons label { margin: 0; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2, #2c2c33); cursor: pointer; font-size: 14px; }
    .rp .reasons input { accent-color: var(--accent); margin: 0; }
    .rp .reasons label:has(input:checked) { border-color: var(--accent); }
    .rp small { color: var(--muted, #b9b9bf); font-weight: 400; }
    .rp .msg { margin: 0; font-size: 14px; color: #f5c046; min-height: 1.4em; }
    .rp .done { padding: 20px; border-radius: 14px; background: var(--surface, #141417); border: 1px solid var(--line, #222228); }
    .rp .done h2 { margin: 0 0 6px; font-size: 20px; }
    .rp .done p { margin: 0; color: var(--muted, #b9b9bf); }
  </style>
</head>
<body>
  <header class="nav">
    <a class="nav-logo" href="/" aria-label="Chucksi home"><svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="11.5" fill="none" stroke="currentColor" stroke-width="3"/><circle cx="16" cy="16" r="3.6" fill="currentColor"/><path d="M16 1.5v6M16 24.5v6M1.5 16h6M24.5 16h6" stroke="currentColor" stroke-width="3"/></svg></a>
  </header>
  <main class="rp">
    <h1>Report a site</h1>
    <p>Sites on v2web.site are made by Chucksi users. Tell us what is wrong and we will review it.</p>
    <form id="report" novalidate>
      <div>
        <label for="site">Site address</label>
        <div class="addr"><input type="text" id="site" name="site" required maxlength="80" autocomplete="off" autocapitalize="off" spellcheck="false"><span>.v2web.site</span></div>
      </div>
      <fieldset>
        <legend>What is wrong?</legend>
        <div class="reasons">
          <label><input type="radio" name="reason" value="phishing" required> Phishing</label>
          <label><input type="radio" name="reason" value="scam"> Scam or fraud</label>
          <label><input type="radio" name="reason" value="impersonation"> Impersonation</label>
          <label><input type="radio" name="reason" value="malware"> Malware</label>
          <label><input type="radio" name="reason" value="spam"> Spam</label>
          <label><input type="radio" name="reason" value="illegal"> Illegal content</label>
          <label><input type="radio" name="reason" value="copyright"> Copyright</label>
          <label><input type="radio" name="reason" value="other"> Other</label>
        </div>
      </fieldset>
      <div>
        <label for="details">Details <small>(optional)</small></label>
        <textarea id="details" name="details" maxlength="2000"></textarea>
      </div>
      <div>
        <label for="contact">Your email <small>(optional, if you want a reply)</small></label>
        <input type="email" id="contact" name="contact" maxlength="200" autocomplete="email">
      </div>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <div><button type="submit" class="btn-accent" id="send">Send report</button></div>
    </form>
    <div class="done" id="done" hidden><h2>Thanks for the report.</h2><p>We will review the site. Sites that break the <a href="/terms.html#hosting">hosting rules</a> are taken down.</p></div>
  </main>
  <footer class="foot">
    <span>© 2026 Chucksi</span>
    <nav aria-label="Footer"><a href="/credits.html">Credits</a><a href="/privacy.html">Privacy</a><a href="/terms.html">Terms</a><a href="https://github.com/ChuckGPTX/massless" rel="noopener">GitHub ↗</a></nav>
  </footer>
  <script type="module" src="/js/pages/report.js"></script>
</body>
</html>
