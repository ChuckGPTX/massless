<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1200px; height: 630px; overflow: hidden; background: #0b0b0c; }

.s1 { background: #ffbf2f; color: #0b0b0c; transform: rotate(-3deg); }

.s3 { background: #f6f6f2; color: #0b0b0c; transform: rotate(-1.5deg); }

.url b { color: #c9c9ce; font-weight: 600; }

.frame { position: absolute; border-radius: 16px; overflow: hidden; border: 3px solid #f6f6f2; box-shadow: 0 30px 60px rgba(0,0,0,.6), 8px 8px 0 #0b0b0c; background: #111; }

.ui { position: absolute; font: 800 18px/1 'BS', sans-serif; letter-spacing: .08em; text-transform: uppercase; }
.rec { left: 12px; top: 12px; display: flex; align-items: center; gap: 7px; background: rgba(0,0,0,.6); padding: 7px 10px; border-radius: 8px; color: #fff; font: 600 14px/1 ui-monospace, monospace; letter-spacing: .04em; }
.rec i { width: 9px; height: 9px; border-radius: 50%; background: #ff4f6d; }
.chip { left: 12px; bottom: 12px; background: #ffbf2f; color: #0b0b0c; padding: 8px 11px; border-radius: 8px; }
.chip2 { right: 12px; bottom: 12px; background: #fff; color: #0b0b0c; padding: 8px 11px; border-radius: 8px; }

.c1 { left: 12px; top: 12px; border-right: 0; border-bottom: 0; } .c2 { right: 12px; top: 12px; border-left: 0; border-bottom: 0; }
.c3 { left: 12px; bottom: 12px; border-right: 0; border-top: 0; } .c4 { right: 12px; bottom: 12px; border-left: 0; border-top: 0; }
.cursor { position: absolute; left: 1088px; top: 236px; z-index: 5; filter: drop-shadow(3px 4px 0 #0b0b0c); }
.badge { position: absolute; left: 606px; top: 282px; width: 150px; height: 150px; z-index: 6; transform: rotate(-12deg); }
.badge .core { position: absolute; inset: 22px; border-radius: 50%; background: #ff4f6d; border: 3px solid #0b0b0c; box-shadow: 5px 5px 0 #0b0b0c; display: grid; place-items: center; font: 900 54px/1 'BS', sans-serif; color: #fff; }
.badge svg { position: absolute; inset: 0; animation: none; }
.spark { position: absolute; z-index: 6; }
</style></head>
