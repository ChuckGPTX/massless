<!doctype html>
<html><head><meta charset="utf-8"><title>plates</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
<style>body{margin:0;background:#222}canvas{max-width:100vw}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
import { render, project, THREE } from './lib.js';
import { SCENES } from './scenes.js';
import { PRODUCTS } from './products.js';
import { MOCKUPS } from './mockups.js';
window.renderPlate = async (kind, id, W, H, frames, pass) => {
  const set = kind === 'product' ? PRODUCTS : kind === 'mockup' ? MOCKUPS : SCENES;
  const def = set[id];
  const t0 = performance.now();
  const r = await render({ build: def.build }, { W, H, frames: frames || def.frames || 48, canvas: document.getElementById('c'), pass });
  const meta = def.meta ? def.meta(r, { project }) : {};
  if (kind === 'scene') {
    const a = def.anchor, cam = r.camera;
    const p0 = project(cam, a), p1 = project(cam, [a[0], a[1] + def.productH, a[2]]);
    const px = project(cam, [a[0] + 0.5, a[1], a[2]]), nx = project(cam, [a[0] - 0.5, a[1], a[2]]);
    const pz = project(cam, [a[0], a[1], a[2] + 0.5]), nz = project(cam, [a[0], a[1], a[2] - 0.5]);
    // cast shadow direction on the floor, away from the key light, per unit of product height
    const kb = r.keyBase.clone(); const toL = new THREE.Vector3(kb.x - a[0], 0, kb.z - a[2]).normalize();
    const elev = Math.atan2(kb.y - a[1], Math.hypot(kb.x - a[0], kb.z - a[2]));
    const len = Math.min(2.2, 1 / Math.tan(elev)) * def.productH;
    const ps = project(cam, [a[0] - toL.x * len, a[1], a[2] - toL.z * len]);
    Object.assign(meta, {
      anchor: [+(p0[0]).toFixed(4), +(p0[1]).toFixed(4)],
      height: +(p0[1] - p1[1]).toFixed(4),
      ellipse: +(Math.abs(pz[1] - nz[1]) / Math.max(1e-4, Math.abs(px[0] - nx[0]) * (W / H))).toFixed(3),
      shadow: [+((ps[0] - p0[0]) * W / H).toFixed(4), +(ps[1] - p0[1]).toFixed(4)],
    });
  }
  return { png: document.getElementById('c').toDataURL('image/png'), meta, ms: Math.round(performance.now() - t0) };
};
window.ready = true;
</script></body></html>
